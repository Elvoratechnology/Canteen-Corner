version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: canteen-corner-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres_secure_2026@db:5432/canteen_corner?schema=public
      - JWT_SECRET=${JWT_SECRET}
      - NODE_ENV=production
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - PAYPAL_CLIENT_ID=${PAYPAL_CLIENT_ID}
      - PAYPAL_CLIENT_SECRET=${PAYPAL_CLIENT_SECRET}
      - PAYPAL_WEBHOOK_ID=${PAYPAL_WEBHOOK_ID}
      - WEEKLY_RESET_DAY=0
      - DEFAULT_WEEKLY_LIMIT=100.00
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: canteen-corner-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_2026
      POSTGRES_DB: canteen_corner
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d canteen_corner"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

